name: SER-54 desktop context-menu memory tests

on:
  push:
    branches:
      - fix/ser-54-free-context-menu-labels
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-menu-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate desktop UI assets
        run: |
          go install github.com/tkrajina/typescriptify-golang-structs/tscriptify@latest
          go generate ./app/ui

      - name: Verify Go toolchain
        run: go version

      - name: Context menu lifecycle tests
        run: go test -count=1 -run 'Test(SetContextMenuItems|ClearContextMenuItems)' ./app/cmd/app
