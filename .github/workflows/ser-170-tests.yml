name: SER-170 Gemma 4 parser tests

on:
  push:
    branches:
      - ser-170-github-actions-tests
      - fix/ser-170-gemma4-toolcall-errors
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: false

      - name: Go version
        run: go version

      - name: Parser tests
        run: go test ./model/parsers -count=1 -v

      - name: Renderer tests
        run: go test ./model/renderers -count=1 -v

      - name: Gemma 4 focused tests
        run: go test ./model/parsers -run 'Gemma4|Gemma' -count=1 -v
